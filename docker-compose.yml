services:
  effihub:
    image: jacyli/effihub:latest
    container_name: effihub
    ports:
      - "8899:8899"
    volumes:
      - ./data:/app/data
    environment:
      # 应用端口
      PORT: 8899
      # 后台管理密码
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-1qaz@WSX#EDC}
      # JWT 密钥
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-here}
      # 图片上传配置
      IMAGE_UPLOAD_API: ${IMAGE_UPLOAD_API:-}
      IMAGE_UPLOAD_TOKEN: ${IMAGE_UPLOAD_TOKEN:-}
      # 数据库配置
      DB_HOST: ${DB_HOST:-mysql-host.com}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-username}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-database}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8899/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
