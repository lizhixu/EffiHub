<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EffiHub 后台管理</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-window: #1e1e1e;
            --bg-sidebar: #252526;
            --bg-hover: #2a2d2e;
            --bg-active: #37373d;
            --text-primary: #cccccc;
            --text-secondary: #858585;
            --text-title: #ffffff;
            --border: #3c3c3c;
            --accent: #0078d4;
            --titlebar: #323233;
        }
        [data-theme="light"] {
            --bg-window: #ffffff;
            --bg-sidebar: #f3f3f3;
            --bg-hover: #e8e8e8;
            --bg-active: #d4d4d4;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-title: #1e1e1e;
            --border: #e0e0e0;
            --titlebar: #e8e8e8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif; background: var(--bg-window); color: var(--text-primary); min-height: 100vh; font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        
        /* Login Page */
        .login-container { display: none; justify-content: center; align-items: center; min-height: 100vh; background-color: var(--bg-window); background-image: radial-gradient(var(--border) 1px, transparent 1px); background-size: 24px 24px; position: relative; }
        .login-box { background: var(--bg-sidebar); padding: 40px; border-radius: 10px; width: 380px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: relative; }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo img { height: 56px; width: auto; margin-bottom: 16px; }
        .login-logo h2 { color: var(--text-title); font-size: 18px; font-weight: 600; margin-bottom: 6px; }
        .login-logo p { color: var(--text-secondary); font-size: 12px; }
        .logo-light { display: none; } .logo-dark { display: block; }
        [data-theme="light"] .logo-light { display: block; } [data-theme="light"] .logo-dark { display: none; }
        .login-box .input-group { position: relative; margin-bottom: 20px; }
        .login-box .input-group .icon-lock { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }
        .login-box .input-group input { width: 100%; padding: 10px 36px 10px 36px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-window); color: var(--text-primary); font-size: 13px; outline: none; transition: background 0.15s, border-color 0.15s; }
        .login-box .input-group input:focus { background: var(--bg-active); border-color: var(--accent); }
        .login-box .input-group input::placeholder { color: var(--text-secondary); }
        .btn-toggle-pwd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; padding: 0; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; transition: color 0.15s, background 0.15s; }
        .btn-toggle-pwd:hover { color: var(--text-primary); background: var(--bg-hover); }
        .login-btn { width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.15s, transform 0.15s; }
        .login-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .login-btn:active { opacity: 1; transform: translateY(0); }
        .remember-row { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .remember-row input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; }
        .remember-row label { font-size: 12px; color: var(--text-secondary); cursor: pointer; user-select: none; }
        .back-home { position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-secondary); text-decoration: none; transition: color 0.15s, background 0.15s; padding: 6px 8px; border-radius: 6px; }
        .back-home:hover { color: var(--text-primary); background: var(--bg-hover); }
        .back-home svg { width: 14px; height: 14px; }
        .login-theme-btn { position: absolute; top: 12px; right: 12px; }
        
        /* Admin Main */
        .admin-container { display: none; padding: 0 20px 20px; max-width: 1200px; margin: 0 auto; }
        .admin-header { position: sticky; top: 0; z-index: 50; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 12px 20px; background: var(--bg-sidebar); border-radius: 0 0 8px 8px; border: 1px solid var(--border); border-top: none; }
        .header-logo { display: flex; align-items: center; gap: 12px; }
        .header-logo img { height: 28px; width: auto; }
        .header-logo span { font-size: 14px; font-weight: 500; color: var(--text-title); }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-danger { background: #d32f2f; color: #fff; }
        .btn-secondary { background: var(--bg-hover); color: var(--text-primary); border: 1px solid transparent; }
        .btn-secondary:hover { border-color: var(--border); background: var(--bg-active); }
        .btn:hover { opacity: 0.9; }
        .theme-toggle { width: 28px; height: 28px; padding: 0; border: none; border-radius: 6px; background: transparent; color: var(--text-secondary); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }
        .theme-toggle:hover { background: var(--bg-hover); color: var(--text-primary); }
        .theme-toggle svg { width: 16px; height: 16px; }
        
        /* Tabs & Toolbar */
        .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--bg-sidebar); padding: 4px; border-radius: 8px; display: inline-flex; border: 1px solid var(--border); }
        .tab { padding: 6px 16px; background: transparent; border: none; color: var(--text-secondary); border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; }
        .tab.active { background: var(--bg-hover); color: var(--text-title); }
        .tab:hover:not(.active) { color: var(--text-primary); }
        .toolbar { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
        .toolbar select { padding: 6px 10px; background: var(--bg-sidebar); border: 1px solid var(--border); color: var(--text-primary); border-radius: 6px; font-size: 12px; outline: none; transition: border-color 0.15s; }
        .toolbar select:focus { border-color: var(--accent); }
        
        /* Data Table */
        .data-table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-sidebar); }
        .data-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .data-table th, .data-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; font-size: 12px; }
        .data-table th { background: var(--titlebar); color: var(--text-secondary); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table td { color: var(--text-primary); }
        .data-table .actions { display: flex; gap: 4px; white-space: nowrap; }
        .data-table .actions-cell, .data-table .icon-cell { overflow: visible; text-overflow: clip; }
        .data-table .icon-cell { text-align: center; padding: 10px 8px; }
        .data-table .icon-cell img { width: 24px; height: 24px; border-radius: 4px; object-fit: cover; vertical-align: middle; background: var(--bg-hover); }
        
        /* Badges & Toggles */
        .require-login-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; background: rgba(0,120,212,0.15); color: var(--accent); border: 1px solid rgba(0,120,212,0.3); }
        .public-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; background: var(--bg-hover); color: var(--text-secondary); border: 1px solid transparent; }
        .toggle-switch { position: relative; display: inline-block; width: 36px; height: 20px; cursor: pointer; user-select: none; }
        .toggle-slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(135, 135, 135, 0.4); border-radius: 20px; transition: 0.2s; }
        .toggle-slider:before { content: ''; position: absolute; width: 16px; height: 16px; left: 2px; bottom: 2px; background: #fff; border-radius: 50%; transition: 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
        .toggle-switch.active .toggle-slider { background: #34c759; }
        .toggle-switch.active .toggle-slider:before { transform: translateX(16px); }
        .disabled-row { opacity: 0.5; }
        
        /* Icon Buttons */
        .btn-icon { width: 26px; height: 26px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; border: 1px solid transparent; background: transparent; color: var(--text-secondary); cursor: pointer; transition: all 0.15s; }
        .btn-icon:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border); }
        .btn-icon.btn-icon-edit:hover { color: var(--accent); }
        .btn-icon.btn-icon-danger:hover { color: #ef4444; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
        .modal.show { display: flex; }
        .modal-content { background: var(--bg-sidebar); padding: 24px; border-radius: 10px; width: 400px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .modal-content h3 { margin-bottom: 16px; color: var(--text-title); font-size: 15px; font-weight: 600; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--text-secondary); }
        .form-group input, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-window); color: var(--text-primary); font-size: 12px; outline: none; transition: background 0.15s, border-color 0.15s; }
        .form-group input:focus, .form-group select:focus { background: var(--bg-active); border-color: var(--accent); }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
        
        /* Upload Area */
        .upload-area { border: 1px dashed var(--border); border-radius: 6px; padding: 16px; text-align: center; cursor: pointer; background: var(--bg-window); transition: border-color 0.15s; }
        .upload-area:hover { border-color: var(--accent); }
        .upload-area.uploading { opacity: 0.6; pointer-events: none; }
        .upload-area input { display: none; }
        .upload-area p { margin: 0; font-size: 12px; color: var(--text-secondary); }
        .upload-preview { margin-top: 8px; }
        .upload-preview img { max-width: 48px; max-height: 48px; border-radius: 6px; }
        .icon-input-wrapper { display: flex; flex-direction: column; gap: 8px; }
        .icon-divider { text-align: center; font-size: 11px; color: var(--text-secondary); margin: 4px 0; }
        .icon-url-input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-window); color: var(--text-primary); font-size: 12px; }
        
        /* Fetch Icon Row */
        .url-input-row { display: flex; gap: 6px; }
        .url-input-row input { flex: 1; }
        .btn-fetch-icon { width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-window); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
        .btn-fetch-icon:hover { color: var(--text-primary); border-color: var(--border); background: var(--bg-hover); }
        .fetch-spinner { display: none; animation: spin 0.8s linear infinite; }
        .btn-fetch-icon.fetching { pointer-events: none; color: var(--accent); border-color: var(--accent); }
        .btn-fetch-icon.fetching .fetch-search { display: none; }
        .btn-fetch-icon.fetching .fetch-spinner { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-secondary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-primary); }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <div class="login-box"><a href="/" class="back-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>首页</a><button class="theme-toggle login-theme-btn" onclick="toggleTheme()" title="切换主题"></button><div class="login-logo"><img src="https://images.lizhixu.cn/i/2025/12/03/12tlo5e.png" alt="EffiHub" class="logo-light"><img src="https://images.lizhixu.cn/i/2025/12/03/12y4do1.png" alt="EffiHub" class="logo-dark"><h2>EffiHub 后台管理</h2><p>高效导航，触手可及</p></div><div class="input-group"><svg class="icon-lock" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="password" placeholder="请输入管理密码"><button type="button" class="btn-toggle-pwd" onclick="togglePassword()" title="显示/隐藏密码" id="togglePwdBtn"><svg class="icon-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div><div class="remember-row"><input type="checkbox" id="rememberMe" checked><label for="rememberMe">记住我（15天免登录）</label></div><button class="login-btn" onclick="login()">登 录</button></div>

    <div class="admin-container" id="adminContainer">
        <div class="admin-header">
            <div class="header-logo">
                <img src="https://images.lizhixu.cn/i/2025/12/03/12tlo5e.png" alt="EffiHub" class="logo-light">

    </div>
    <div class="modal" id="categoryModal"><div class="modal-content"><h3 id="categoryModalTitle">添加分类</h3><input type="hidden" id="categoryId"><div class="form-group"><label>分类名称</label><input type="text" id="categoryName" placeholder="输入分类名称"></div><div class="form-group"><label>图标</label><div class="icon-input-wrapper"><div class="upload-area" onclick="document.getElementById('categoryIconFile').click()"><input type="file" id="categoryIconFile" accept="image/*" onchange="uploadIcon(this,'categoryIcon')"><p><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>点击上传图片</p><div class="upload-preview" id="categoryIconPreview"></div></div><div class="icon-divider">— 或 —</div><input type="text" id="categoryIcon" class="icon-url-input" placeholder="直接粘贴图片URL"></div></div><div class="form-group"><label>标识 (英文)</label><input type="text" id="categorySlug" placeholder="如: dev, design"></div><div class="form-group"><label>排序</label><input type="number" id="categorySort" value="0"></div><div class="remember-row"><input type="checkbox" id="categoryRequireLogin"><label for="categoryRequireLogin">需要登录才能查看</label></div><div class="remember-row"><input type="checkbox" id="categoryEnabled" checked><label for="categoryEnabled">启用</label></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('categoryModal')">取消</button><button class="btn btn-primary" onclick="saveCategory()">保存</button></div></div></div>

v><div class="remember-row"><input type="checkbox" id="linkEnabled" checked><label for="linkEnabled">启用</label></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('linkModal')">取消</button><button class="btn btn-primary" onclick="saveLink()">保存</button></div></div></div>

    <script>
        const API='/api';
        let categories=[],links=[],IMG_API='',IMG_TOKEN='',fetchController=null;

        // Token 管理
        function getToken(){return localStorage.getItem('admin_token')||sessionStorage.getItem('admin_token')||'';}
        function storeToken(token,remember){if(remember){localStorage.setItem('admin_token',token);sessionStorage.removeItem('admin_token');}else{sessionStorage.setItem('admin_token',token);localStorage.removeItem('admin_token');}}
        function clearToken(){localStorage.removeItem('admin_token');sessionStorage.removeItem('admin_token');sessionStorage.removeItem('admin_logged');}
        function authHeaders(){const t=getToken();return t?{'Content-Type':'application/json','Authorization':'Bearer '+t}:{'Content-Type':'application/json'};}

        // 获取上传配置
        fetch(API+'/auth/upload-config').then(r=>r.json()).then(d=>{IMG_API=d.api;IMG_TOKEN=d.token;});

        const themes=['auto','light','dark'],themeIcons={auto:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>',light:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>',dark:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'};
        function getSystemTheme(){return window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}
        function applyTheme(t){document.documentElement.setAttribute('data-theme',t==='auto'?getSystemTheme():t);document.querySelectorAll('.theme-toggle').forEach(btn => btn.innerHTML=themeIcons[t]);}
        let currentTheme=localStorage.getItem('theme')||'auto';applyTheme(currentTheme);
        window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(localStorage.getItem('theme')==='auto')applyTheme('auto');});
        function toggleTheme(){currentTheme=themes[(themes.indexOf(currentTheme)+1)%3];localStorage.setItem('theme',currentTheme);applyTheme(currentTheme);}
        async function uploadIcon(input,targetId){const file=input.files[0];if(!file)return;const uploadArea=input.closest('.upload-area'),preview=uploadArea.querySelector('.upload-preview');uploadArea.classList.add('uploading');preview.innerHTML='<p>上传中...</p>';const formData=new FormData();formData.append('image',file);formData.append('token',IMG_TOKEN);try{const res=await fetch(IMG_API,{method:'POST',body:formData});const data=await res.json();if(data.result==='success'&&data.url){document.getElementById(targetId).value=data.url;preview.innerHTML=`<img src="${data.url}">`;}else throw new Error(data.message||'上传失败');}catch(e){alert('图片上传失败: '+e.message);preview.innerHTML='';}finally{uploadArea.classList.remove('uploading');input.value='';}}
        async function autoFetchFavicon(){const url=document.getElementById('linkUrl').value.trim();if(!url)return;const btn=document.querySelector('.btn-fetch-icon');try{new URL(url.startsWith('http')?url:'https://'+url);}catch(e){return;}if(fetchController)fetchController.abort();fetchController=new AbortController();btn.classList.add('fetching');try{const resp=await fetch(`${API}/favicon?url=${encodeURIComponent(url)}`,{signal:fetchController.signal});if(resp.ok){const data=await resp.json();if(data.icon){document.getElementById('linkIcon').value=data.icon;document.getElementById('linkIconPreview').innerHTML=`<img src="${data.icon}">`;}if(data.title)document.getElementById('linkName').value=data.title;if(data.description)document.getElementById('linkDesc').value=data.description;}}catch(e){if(e.name!=='AbortError')console.log('网站信息获取失败:',e);}finally{btn.classList.remove('fetching');fetchController=null;}}
        function togglePassword(){const pwd=document.getElementById('password');const btn=document.getElementById('togglePwdBtn');if(pwd.type==='password'){pwd.type='text';btn.innerHTML='<svg class="icon-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';}else{pwd.type='password';btn.innerHTML='<svg class="icon-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';}}
        async function login(){const pwd=document.getElementById('password').value;const remember=document.getElementById('rememberMe').checked;try{const res=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd,remember_me:remember})});const data=await res.json();if(data.success&&data.token){storeToken(data.token,remember);sessionStorage.setItem('admin_logged','true');showAdmin();}else alert('密码错误');}catch(e){alert('登录失败');}}
        function logout(){clearToken();location.reload();}
        function showAdmin(){document.getElementById('loginContainer').style.display='none';document.getElementById('adminContainer').style.display='block';loadData();}
        function showTab(tab){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(c=>c.style.display='none');event.target.classList.add('active');document.getElementById(tab+'Tab').style.display='block';}
        async function loadData(){try{const t=Date.now();const[catRes,linkRes]=await Promise.all([fetch(`${API}/categories?_t=${t}`,{headers:authHeaders()}),fetch(`${API}/links?_t=${t}`,{headers:authHeaders()})]);categories=await catRes.json()||[];links=await linkRes.json()||[];renderCategories();renderLinks();renderCategorySelects();}catch(e){console.error('加载失败',e);}}
        function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
        function renderCategories(){document.getElementById('categoriesBody').innerHTML=categories.map(c=>`<tr class="${c.enabled?'':'disabled-row'}"><td>${c.id}</td><td class="icon-cell">${c.icon?`<img src="${escapeHtml(c.icon)}" onerror="this.style.display='none'">`:'—'}</td><td title="${escapeHtml(c.name)}">${escapeHtml(c.name)}</td><td title="${escapeHtml(c.slug)}">${escapeHtml(c.slug)}</td><td class="icon-cell">${c.require_login?'<span class="require-login-badge">是</span>':'<span class="public-badge">否</span>'}</td><td>${c.sort}</td><td class="icon-cell"><span class="toggle-switch${c.enabled?' active':''}" data-type="category" data-id="${c.id}" data-enabled="${c.enabled}"><span class="toggle-slider"></span></span></td><td class="actions-cell"><div class="actions"><button class="btn-icon btn-icon-edit" onclick="editCategory(${c.id})" title="编辑"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button class="btn-icon btn-icon-danger" onclick="deleteCategory(${c.id})" title="删除"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div></td></tr>`).join('');}
        function renderLinks(){const filterId=document.getElementById('filterCategory').value;const filtered=filterId?links.filter(l=>l.category_id==filterId):links;document.getElementById('linksBody').innerHTML=filtered.map(l=>{const cat=categories.find(c=>c.id===l.category_id);return`<tr class="${l.enabled?'':'disabled-row'}"><td>${l.id}</td><td class="icon-cell">${l.icon?`<img src="${escapeHtml(l.icon)}" onerror="this.style.display='none'">`:'—'}</td><td title="${escapeHtml(l.name)}">${escapeHtml(l.name)}</td><td title="${escapeHtml(l.desc)}">${escapeHtml(l.desc||'')}</td><td>${escapeHtml(cat?.name||'—')}</td><td>${l.sort}</td><td class="icon-cell"><span class="toggle-switch${l.enabled?' active':''}" data-type="link" data-id="${l.id}" data-enabled="${l.enabled}"><span class="toggle-slider"></span></span></td><td class="actions-cell"><div class="actions"><button class="btn-icon btn-icon-edit" onclick="editLink(${l.id})" title="编辑"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button class="btn-icon btn-icon-danger" onclick="deleteLink(${l.id})" title="删除"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div></td></tr>`;}).join('');}
        function renderCategorySelects(){const opts=categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');document.getElementById('filterCategory').innerHTML='<option value="">全部分类</option>'+opts;document.getElementById('linkCategory').innerHTML=opts;document.getElementById('filterCategory').onchange=renderLinks;}
        function showCategoryModal(id=null){document.getElementById('categoryModalTitle').textContent=id?'编辑分类':'添加分类';document.getElementById('categoryId').value=id||'';document.getElementById('categoryIconPreview').innerHTML='';if(id){const c=categories.find(x=>x.id===id);document.getElementById('categoryName').value=c.name;document.getElementById('categoryIcon').value=c.icon||'';document.getElementById('categorySlug').value=c.slug;document.getElementById('categorySort').value=c.sort;document.getElementById('categoryRequireLogin').checked=!!c.require_login;document.getElementById('categoryEnabled').checked=!!c.enabled;if(c.icon)document.getElementById('categoryIconPreview').innerHTML=`<img src="${c.icon}">`;}else{['categoryName','categoryIcon','categorySlug'].forEach(x=>document.getElementById(x).value='');document.getElementById('categorySort').value='0';document.getElementById('categoryRequireLogin').checked=false;document.getElementById('categoryEnabled').checked=true;}document.getElementById('categoryModal').classList.add('show');}
        function editCategory(id){showCategoryModal(id);}
        async function saveCategory(){const id=document.getElementById('categoryId').value;const data={name:document.getElementById('categoryName').value,icon:document.getElementById('categoryIcon').value,slug:document.getElementById('categorySlug').value,sort:parseInt(document.getElementById('categorySort').value)||0,require_login:document.getElementById('categoryRequireLogin').checked,enabled:document.getElementById('categoryEnabled').checked};await fetch(id?`${API}/categories/${id}`:`${API}/categories`,{method:id?'PUT':'POST',headers:authHeaders(),body:JSON.stringify(data)});closeModal('categoryModal');loadData();}
        async function deleteCategory(id){if(!confirm('确定删除？相关链接也会被删除'))return;await fetch(`${API}/categories/${id}`,{method:'DELETE',headers:authHeaders()});loadData();}
        function showLinkModal(id=null){document.getElementById('linkModalTitle').textContent=id?'编辑链接':'添加链接';document.getElementById('linkId').value=id||'';document.getElementById('linkIconPreview').innerHTML='';if(id){const l=links.find(x=>x.id===id);document.getElementById('linkCategory').value=l.category_id;document.getElementById('linkName').value=l.name;document.getElementById('linkUrl').value=l.url;document.getElementById('linkIcon').value=l.icon||'';document.getElementById('linkDesc').value=l.desc||'';document.getElementById('linkSort').value=l.sort;document.getElementById('linkEnabled').checked=!!l.enabled;if(l.icon)document.getElementById('linkIconPreview').innerHTML=`<img src="${l.icon}">`;}else{['linkName','linkUrl','linkIcon','linkDesc'].forEach(x=>document.getElementById(x).value='');document.getElementById('linkSort').value='0';document.getElementById('linkEnabled').checked=true;}document.getElementById('linkModal').classList.add('show');}
        function editLink(id){showLinkModal(id);}
        async function saveLink(){const id=document.getElementById('linkId').value;const data={category_id:parseInt(document.getElementById('linkCategory').value),name:document.getElementById('linkName').value,url:document.getElementById('linkUrl').value,icon:document.getElementById('linkIcon').value,desc:document.getElementById('linkDesc').value,sort:parseInt(document.getElementById('linkSort').value)||0,enabled:document.getElementById('linkEnabled').checked};await fetch(id?`${API}/links/${id}`:`${API}/links`,{method:id?'PUT':'POST',headers:authHeaders(),body:JSON.stringify(data)});closeModal('linkModal');loadData();}
        async function deleteLink(id){if(!confirm('确定删除？'))return;await fetch(`${API}/links/${id}`,{method:'DELETE',headers:authHeaders()});loadData();}
        function closeModal(id){document.getElementById(id).classList.remove('show');if(id==='linkModal'){if(fetchController)fetchController.abort();const btn=document.querySelector('.btn-fetch-icon');if(btn)btn.classList.remove('fetching');}}
        document.addEventListener('click',function(e){const sw=e.target.closest('.toggle-switch');if(!sw||sw.dataset.busy==='1')return;e.preventDefault();const wasActive=sw.classList.contains('active');const newState=!wasActive;sw.dataset.busy='1';sw.classList.toggle('active',newState);sw.dataset.enabled=newState;const row=sw.closest('tr');if(row)row.classList.toggle('disabled-row',!newState);const type=sw.dataset.type,id=parseInt(sw.dataset.id);fetch(`${API}/${type==='category'?'categories':'links'}/${id}`,{method:'PATCH',headers:authHeaders(),body:JSON.stringify({enabled:newState})}).then(res=>{if(!res.ok)throw new Error('fail');const arr=type==='category'?categories:links;const item=arr.find(x=>x.id===id);if(item)item.enabled=newState;}).catch(()=>{sw.classList.toggle('active',wasActive);sw.dataset.enabled=wasActive;if(row)row.classList.toggle('disabled-row',!wasActive);}).finally(()=>{delete sw.dataset.busy;});});
        if(getToken())showAdmin();
        else document.getElementById('loginContainer').style.display='flex';
        document.getElementById('password').onkeypress=e=>{if(e.key==='Enter')login();};
        window.addEventListener('pageshow',function(e){if(e.persisted&&getToken())loadData();});
    </script>
</body>
</html>
